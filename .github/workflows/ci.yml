name: Build & Test

# develop is the single source of truth for the code. production is just a
# CI/CD mirror: it always points at the same commit as develop, and pushing to
# it runs the same build+test pipeline. Actual releases are created by pushing
# a version tag (see release.yml), which builds the installers.
on:
  push:
    branches: [develop, production]
  pull_request:
    branches: [develop, production]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: node scripts/verify.js
